name: recon-social-cron

# Capa 1 — Vigilia: escanea señales externas del mercado cada 6 horas.
# Detecta: repos de competidores nuevos, tendencias de búsqueda,
# menciones en redes, cambios en la competencia.
# Reutiliza scripts/recon_repos.py + scripts/recon_social.py.
# No toma acción — solo hace visible lo que está pasando afuera.
# Los resultados se publican en recon-state para que daily-analysis los consuma
# sin escribir directamente en la rama protegida main.

on:
  schedule:
    - cron: "0 */6 * * *"          # cada 6 horas
  workflow_dispatch:                # permitido forzar manualmente

concurrency:
  group: recon-social-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Persistir resultados para el análisis diario
        run: |
          set -euo pipefail
          mkdir -p data/recon
          {
            echo "--- recon repos $(date -u +%Y-%m-%dT%H:%M:%SZ) ---"
            python3 scripts/recon_repos.py
            echo ""
            echo "--- recon social $(date -u +%Y-%m-%dT%H:%M:%SZ) ---"
            python3 scripts/recon_social.py
          } > data/recon/latest_recon.txt 2>&1
          echo "Recon guardado en data/recon/latest_recon.txt"

      - name: Publicar snapshot en la rama recon-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/publish_recon_snapshot.sh data/recon/latest_recon.txt origin recon-state
