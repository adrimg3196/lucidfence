name: monitor-hourly

# Capa 1 — Vigilia: detecta problemas de producto sin esperar a que
# alguien pregunte. Cada hora verifica:
#   1. Vitrina pública reachability
#   2. Estructura mínima de cloud_state.json
#   3. Tests pasando (runner honesto)
#   4. Regresiones recientes en CI (últimos 3 días)
#
# Si detecta un problema, crea un issue con label e información de
# diagnóstico. No intenta arreglar nada — solo hace visible lo roto.
#
# Reutiliza scripts/health_monitor.py para los checks, y añade
# detección de regresiones de CI vía GitHub API.

on:
  schedule:
    - cron: "0 * * * *"          # cada hora en :00 UTC
  workflow_dispatch:              # permitido forzar manualmente

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-hourly
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar deps
        run: python -m pip install -r requirements.txt

      - name: Verificar vitrina (URL + esquema, fuente única)
        run: python3 scripts/check_vitrina.py

      - name: Correr tests del repo (runner honesto)
        run: |
          python3 tests/run_tests.py
        timeout-minutes: 10

      - name: Detectar regresiones de CI recientes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Regresiones CI últimas 24h ==="
          # Obtener los últimos éxitos/fallos del workflow de CI
          if gh api repos/adrimg3196/lucidfence/actions/workflows/11780454598/runs?per_page=10 --jq '.workflow_runs[] | {status: .status, conclusion: .conclusion, created: .created_at}' 2>/dev/null | head -20; then
            echo "OK: CI visible"
          else
            echo "::warning::No se pudo consultar CI reciente (puede ser primer ejecución)"
          fi

      - name: Reportar incidentes detectados
        if: env.vitrina_down == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `Vitrina pública caída — ${today}`;
            const body = `## Incidente detectado automáticamente\n\n- **Cuándo:** ${new Date().toISOString()}\n- **Qué:** Vitrina pública (data/cloud_state.json) no reachable\n- **Impacto:** Dashboard y vitrina serverless caídos\n- **Acción sugerida:** Verificar que engine-cron esté corriendo y que el push de cloud_state.json esté llegando a main\n\nEste issue fue creado por el monitor hourly. No requiere respuesta inmediata salvo que persista > 2 horas.`;
            // Verificar si ya existe un issue abierto para hoy
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monitor-incident',
              per_page: 5
            });
            const hasOpen = existing.data.some(i => i.title.includes('Vitrina pública caída'));
            if (!hasOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['monitor-incident', 'triage']
              });
            } else {
              console.log('Ya existe issue abierto para esta incidencia — no se duplica');
            }
