name: Docker build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un force-push sobre un run de PR en vuelo lo deja corriendo contra una ref
# que ya no existe: el run muere en `failure` y GitHub manda correo al dueño
# por un fallo que no dice nada (pasó: gitleaks contra sha huérfano, run
# 32757168118). Con cancel-in-progress el run superado se CANCELA, y los
# cancelados no generan correo. En pushes a main no se cancela: verificar main
# entero, aunque llegue otro push detrás.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: lucidfence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
