name: publish-pages

# Publica la superficie ESTÁTICA pública (landing + vitrina serverless) en
# GitHub Pages. No es un runtime alojado: cloud.html lee el estado demo vía
# raw.githubusercontent y todo lo demás corre en el navegador del visitante
# (el roadmap declara "la vitrina serverless (GitHub Pages) cubre la
# captación"). Motivo de origen: el despliegue antiguo de Pages quedó
# congelado sirviendo una landing retirada, violando el P0 #110 en la
# superficie pública aunque main ya estaba limpio. Este workflow hace que lo
# publicado sea SIEMPRE lo que hay en main.
on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "static/robots.txt"
      - "docs/comparisons/**"
      - "scripts/pages_seo_check.py"
      - "scripts/build_comparison_pages.py"
      - "scripts/build_sitemap.py"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir sitio estático desde static/
        run: |
          mkdir -p _site
          cp -rL static/* _site/
          # Rutas absolutas /static/... no existen en un project page:
          # se reescriben a relativas (todo vive en la raíz del sitio).
          find _site -maxdepth 1 -name '*.html' -exec sed -i 's#"/static/#"#g' {} +
          test -f _site/index.html
          # Publicar comparativas (gap #2): docs/comparisons/*.md -> _site/comparisons/*.html
          # con canonical absoluto. Genera también el sitemap con todas las URLs
          # (índice, páginas estáticas y comparativas). Ver tarea t_4a5d2f29.
          python3.11 scripts/build_comparison_pages.py --src docs/comparisons --out _site/comparisons
          python3.11 scripts/build_sitemap.py --site _site
          # Descubrimiento SEO (t_087de185 / t_b5902025): robots.txt de la raíz
          # del repo NO llega a Pages vía `cp -rL static/*` solo si no existe.
          # Lo publicamos explícitamente y lo verificamos como guardarraíl para
          # que un futuro regreso a no-tener-robots.txt rompa el build en lugar
          # de publicar una superficie sin robots.txt.
          if [ -f "static/robots.txt" ]; then cp -L static/robots.txt _site/; fi
          test -f _site/robots.txt || { echo "::error::static/robots.txt no se publicó a Pages"; exit 1; }
          # Guardarraíl del P0 #110 también en el artefacto publicado:
          # ninguna cadena de prueba social fabricada puede llegar a Pages.
          grep_status=0
          grep -rlE 'Marina Gómez|Álvaro Rivas|Lucía Castro|166 clones|10 descargas|100% gratis' _site || grep_status=$?
          if [ "$grep_status" -eq 0 ]; then
            echo "::error::prueba social fabricada detectada en el artefacto"
            exit 1
          fi
          if [ "$grep_status" -gt 1 ]; then
            echo "::error::grep no pudo inspeccionar todo el artefacto"
            exit "$grep_status"
          fi
          # Gate bloqueante y exclusivo de este GitHub Project Pages: el
          # sitemap no representa la superficie SEO de instalaciones self-hosted.
          python3 scripts/pages_seo_check.py --static-dir _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
