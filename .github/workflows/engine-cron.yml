name: engine-cron

# Backend serverless de LucidFence en GitHub Actions (gratis, siempre-on vía
# schedule cada 15 min). Construye la flota demo, corre el engine de geofencing
# y publica el estado vivo a data/cloud_state.json, que GitHub Pages sirve al
# dashboard. Soporta workflow_dispatch para forzar un ciclo on-demand.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Número de ciclos a correr"
        required: false
        default: "1"

permissions:
  contents: write

# Cron cada 15 min: sin concurrency dos ciclos pueden solaparse y pelearse por
# la misma rama de datos; sin timeout, un cuelgue ocupa un runner sin fin.
concurrency:
  group: engine-cron
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # OJO con este numero: `timeout-minutes` de JOB cuenta tambien el tiempo que
    # el job pasa ESPERANDO runner, no solo ejecutando. En una cuenta gratuita
    # los runs de `schedule` ya llegan con retraso y la cola puede pasar de 10
    # min. Cuando salta, el job queda `cancelled` pero el RUN queda `failure`,
    # y un run de `schedule` en `failure` manda correo al propietario: un
    # hipo de infraestructura disfrazado de fallo del repo (pasó: run 32734026688,
    # 15 min en cola, cero pasos ejecutados). El limite util contra CUELGUES va
    # a nivel de PASO, que solo corre cuando ya hay runner; el de job se queda
    # como red de seguridad holgada.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar deps
        timeout-minutes: 8
        run: python -m pip install -r requirements.txt
      - name: Correr ciclo y publicar estado
        timeout-minutes: 8
        env:
          CLOUD_PUBLISH: "1"
        run: |
          python -m lucidfence.core.cloud_publisher --cycles "${{ github.event.inputs.cycles || '1' }}"
      - name: Publicar estado a la rama cloud-state (no a main)
        timeout-minutes: 5
        # El snapshot vivo se publica en una rama dedicada, NO en main: así el
        # historial de main queda limpio (era ~1 commit cada 15 min). La vitrina
        # y los health-checks leen el raw de refs/heads/cloud-state. Rama efímera
        # de datos, estilo gh-pages; su historial no se lee.
        run: |
          git config user.name "lucidfence-cloud[bot]"
          git config user.email "cloud@lucidfence.local"
          cp data/cloud_state.json "$RUNNER_TEMP/cloud_state.json"
          # El run del publisher deja sucios ficheros trackeados de data/ y el
          # checkout de rama se niega con el arbol sucio. El runner es efimero
          # y el snapshot ya esta copiado: descartar todo es seguro.
          git checkout -- .
          # `|| true` sobre el fetch se tragaba CUALQUIER fallo, y entonces el
          # else creaba una rama HUERFANA (historia nueva) cuyo push se rechaza
          # por non-fast-forward: un parpadeo de red acababa disfrazado de
          # problema de historia de git. Ahora se distingue "la rama no existe"
          # (ls-remote RC=2 -> huerfana, correcto) de "no he podido preguntar"
          # (cualquier otro RC -> abortar), que es fail-closed.
          set -e
          rc=0; git ls-remote --exit-code --heads origin cloud-state >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch origin cloud-state --depth 1
            git checkout -B cloud-state origin/cloud-state
          elif [ "$rc" -eq 2 ]; then
            echo "cloud-state aun no existe: primera publicacion (rama huerfana)"
            git checkout --orphan cloud-state
            git rm -rf --cached . >/dev/null 2>&1 || true
          else
            echo "::error::no se pudo consultar origin/cloud-state (rc=$rc);" \
                 "abortando en vez de crear una rama huerfana que rompa el historial"
            exit 1
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/cloud_state.json" data/cloud_state.json
          git add -f data/cloud_state.json
          if git diff --cached --quiet; then
            echo "Sin cambios en cloud_state.json"
          else
            git commit -m "cloud: estado en vivo ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin cloud-state
          fi
