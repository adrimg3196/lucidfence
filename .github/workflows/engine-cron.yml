name: engine-cron

# Backend serverless de LucidFence en GitHub Actions (gratis, siempre-on vía
# schedule cada 15 min). Construye la flota demo, corre el engine de geofencing
# y publica el estado vivo a data/cloud_state.json.
#
# IMPORTANTE (post-incidente #270): el estado se publica en la RAMA DE DATOS
# DEDICADA `cloud-state`, NO en main. main está protegido por el ruleset
# "LucidFence Autonomy B"; un push directo a main (o a cualquier rama bajo
# `~ALL`) rompe con GH013 y congela la vitrina. La vitrina static/cloud.html
# lee data/cloud_state.json desde la rama cloud-state vía raw.githubusercontent.
#
# El código se ejecuta sobre el checkout de main (la rama de datos solo tiene
# data/), y el JSON resultante se vuelca a un worktree de cloud-state y se
# empuja allí. cloud-state conserva SOLO protección contra borrado.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Número de ciclos a correr"
        required: false
        default: "1"

permissions:
  contents: write

env:
  DATA_BRANCH: cloud-state

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar deps
        run: python -m pip install -r requirements.txt

      - name: Correr ciclo y generar estado
        env:
          CLOUD_PUBLISH: "1"
        run: |
          python -m lucidfence.core.cloud_publisher --cycles "${{ github.event.inputs.cycles || '1' }}"

      - name: Publicar snapshot en rama de datos cloud-state
        env:
          DATA_BRANCH: cloud-state
        run: |
          git config user.name "lucidfence-cloud[bot]"
          git config user.email "cloud@lucidfence.local"
          git fetch origin "${DATA_BRANCH}" || true
          WT="$(mktemp -d)"
          if git rev-parse --verify "refs/remotes/origin/${DATA_BRANCH}" >/dev/null 2>&1; then
            git worktree add --force "$WT" "origin/${DATA_BRANCH}"
          else
            echo "::notice::Creando rama de datos ${DATA_BRANCH} desde main"
            git worktree add --force -b "${DATA_BRANCH}" "$WT" origin/main
          fi
          mkdir -p "$WT/data"
          cp data/cloud_state.json "$WT/data/cloud_state.json"
          git -C "$WT" add data/cloud_state.json
          if git -C "$WT" diff --cached --quiet; then
            echo "::notice::Sin cambios en cloud_state.json"
          else
            git -C "$WT" commit -m "cloud: estado en vivo ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git -C "$WT" push origin "HEAD:refs/heads/${DATA_BRANCH}"
            echo "::notice::Publicado data/cloud_state.json en ${DATA_BRANCH}"
          fi
          git worktree remove --force "$WT"
