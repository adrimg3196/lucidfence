# Raíl de entrega de la flota (2/2): mergear en verde.
#
# Cuando la CI de una PR de la flota termina en success, este workflow aplica
# la política del propietario (2026-08-16, "auto-merge total en verde",
# docs/internal/LOOP.md §Coordinación regla 6): squash-merge automático.
#
# Dos vías de disparo, a propósito:
#   - `workflow_run` (CI completada): la vía rápida, mergea en cuanto hay verde.
#   - `schedule` cada 20 min + `workflow_dispatch`: BARRIDO de todas las PRs
#     abiertas de la flota. No depende de que GitHub entregue el evento
#     workflow_run: el 2026-09-01 el workflow quedó deshabilitado y, al
#     reactivarlo, tres CI verdes seguidas no dispararon ni una ejecución;
#     la cola se drenó a mano. Un raíl que depende de un solo evento no es
#     un raíl.
#
# Guardarraíles (innegociables):
#   - solo ramas de la flota (prefijos en FLEET_PREFIXES) del PROPIO repo
#     (jamás forks/terceros);
#   - ni drafts (autonomía total 2026-08-18: outreach y release también
#     auto-mergean en verde; no queda gate humano);
#   - todos los checks del head completados y en verde; se ignora únicamente
#     el helper `train` (merge-train informativo, ajeno al gate QA, con
#     fallos transitorios conocidos por 503 de la API).
#   - un merge rechazado por el ruleset (p. ej. un required check fantasma) se
#     registra como aviso, nunca tumba el run: un cron que falla es un correo
#     al propietario sin señal nueva.
#
# Usa el Actions Secret AGENTS_GITHUB_PAT; sin él, no-op con aviso en el log.
name: Agent automerge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions: {}

# Un solo barrido a la vez: dos ejecuciones solapadas intentarían mergear la
# misma PR y una de las dos acabaría en error por "ya mergeada".
concurrency:
  group: agent-automerge
  cancel-in-progress: false

jobs:
  merge:
    # workflow_run solo cuando la CI acabó en success; el barrido siempre.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Squash-merge de las PRs de flota si todo verde
        timeout-minutes: 10
        uses: actions/github-script@v7
        env:
          HAVE_PAT: ${{ secrets.AGENTS_GITHUB_PAT != '' }}
        with:
          github-token: ${{ secrets.AGENTS_GITHUB_PAT || github.token }}
          script: |
            if (process.env.HAVE_PAT !== 'true') {
              core.notice('AGENTS_GITHUB_PAT no configurado; raíl de entrega inactivo.');
              return;
            }
            const {owner, repo} = context.repo;
            const own = `${owner}/${repo}`;
            // La flota dejó de usar sólo `claude/**` (cada loop publica con su
            // propio prefijo: cto/, devops/, soc/, qa/...). Mientras el guardarraíl
            // exigió `claude/**`, este raíl fue un no-op silencioso: el workflow
            // terminaba en success sin mergear nada y la cola se drenaba a mano.
            // Allowlist explícita (no "cualquier rama"): añadir un loop = una línea.
            // `claude/` es el raíl original (sesiones Claude Code del propietario,
            // agent-pr.yml abre sus PRs); #344 lo sustituyó por los prefijos de
            // loop y dejó sus PRs verdes sin mergear (#371).
            const FLEET_PREFIXES = [
              'claude/', 'cto/', 'devops/', 'soc/', 'qa/', 'fix/', 'kit/', 'seo/', 'pm/',
              'selfimprove/', 'bootstrap/', 'hermes/',
            ];
            const isFleet = (branch) => FLEET_PREFIXES.some(p => (branch || '').startsWith(p));
            const IGNORED = new Set(['train']);

            async function tryMerge(pr) {
              if (pr.draft) { core.info(`#${pr.number} es draft`); return; }
              if (!pr.head.repo || pr.head.repo.full_name !== own) {
                core.info(`#${pr.number}: head en fork, jamás auto-merge de terceros`); return;
              }
              if (!isFleet(pr.head.ref)) { core.info(`#${pr.number}: rama fuera de la flota (${pr.head.ref})`); return; }
              // Autonomía total (propietario 2026-08-18: "todo lo decide la IA,
              // nada los humanos"): sin gate humano. Se auto-mergea todo lo verde,
              // incluido outreach: y release. Guardarraíles que quedan (NO son
              // aprobación humana, son anti-daño): solo ramas de la flota del
              // propio repo, jamás forks/terceros ni drafts.
              const {data: checks} = await github.rest.checks.listForRef({owner, repo, ref: pr.head.sha, per_page: 100});
              const relevant = checks.check_runs.filter(c => !IGNORED.has(c.name));
              if (!relevant.length) { core.info(`#${pr.number}: sin checks en el head`); return; }
              const pending = relevant.filter(c => c.status !== 'completed');
              const red = relevant.filter(c => c.status === 'completed'
                && !['success', 'neutral', 'skipped'].includes(c.conclusion));
              if (pending.length) { core.info(`#${pr.number}: checks pendientes: ${pending.map(c => c.name).join(', ')}`); return; }
              if (red.length) { core.notice(`#${pr.number}: checks rojos (${red.map(c => c.name).join(', ')}): no se mergea`); return; }
              try {
                await github.rest.pulls.merge({owner, repo, pull_number: pr.number, merge_method: 'squash'});
                core.notice(`mergeada #${pr.number} (${pr.title}) — gate QA verde`);
              } catch (e) {
                // 405 = el ruleset la rechaza (p. ej. required check fantasma):
                // aviso visible, no fallo del run. 409 = ya mergeada/cambió el head.
                core.warning(`#${pr.number} no se pudo mergear: ${e.status || ''} ${e.message}`);
              }
            }

            try {
              let candidates = [];
              if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run;
                const branch = run.head_branch || '';
                if (!isFleet(branch)) { core.info(`rama fuera de la flota: ${branch}`); return; }
                if (run.head_repository && run.head_repository.full_name !== own) {
                  core.info('head en fork: jamás auto-merge de terceros'); return;
                }
                const {data: prs} = await github.rest.pulls.list({owner, repo, state: 'open', head: `${owner}:${branch}`});
                if (!prs.length) { core.info('sin PR abierta para la rama'); return; }
                candidates = prs;
              } else {
                // Barrido: todas las PRs abiertas de la flota, sin depender del
                // evento workflow_run.
                candidates = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});
                candidates = candidates.filter(pr => !pr.draft && isFleet(pr.head.ref));
                core.info(`barrido: ${candidates.length} PR(s) de flota abiertas`);
              }
              for (const pr of candidates) {
                await tryMerge(pr);
              }
            } catch (e) {
              // Nunca convertir un hipo de la API en un run rojo (= correo).
              core.warning(`raíl de entrega: ${e.message}`);
            }
