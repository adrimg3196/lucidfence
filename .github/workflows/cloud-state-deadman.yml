name: cloud-state-deadman

# Dead-man switch para engine-cron (t_9e6615ad). El watchdog de #228 vigila
# que los *workflows* programados corran; éste vigila que el *dato vivo* se
# siga publicando. El fallo #270 ocurrió precisamente porque engine-cron
# "corría" pero cloud-state se estancó: la vitrina de Marketing y el
# daily-analysis de Product se rompieron sin que nadie lo notara.
#
# Cada N min comprueba la antigüedad de data/cloud_state.json en la rama
# cloud-state (scripts/cloud_state_aliveness.py). Si está estancado > umbral,
# crea/actualiza un issue de incidente (idempotente) etiquetado
# 'cloud-state-deadman' para que el dueño lo vea sin esperar al reporte semanal.

on:
  schedule:
    # 4 veces por hora (cada 15 min, desfasado de engine-cron en +5) para
    # detectar a la primera el estancamiento y no esperar a la próxima hora.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: "Umbral de antigüedad (min) que declara STALE el snapshot"
        required: false
        default: "120"

permissions:
  contents: read
  issues: write
  actions: write      # NUEVO: necesario para `gh workflow run` (auto-heal)

concurrency:
  group: cloud-state-deadman
  cancel-in-progress: false

env:
  # Medido sobre las ultimas 40 publicaciones reales de cloud-state: gap medio
  # 47 min (la cola de runners retrasa el cron de 15 min) y un gap de 95 min en
  # operacion NORMAL. Con 75 min ese gap habria abierto un incidente falso. 120
  # tolera la cola observada con margen y sigue cazando el incidente real de
  # ayer (696 min sin publicar) en ~2 h.
  DEADMAN_MAX_AGE: "120"
  DEADMAN_LABEL: "cloud-state-deadman"

jobs:
  deadman:
    runs-on: ubuntu-latest
    # `timeout-minutes` de JOB cuenta tambien la ESPERA de runner; con la cola
    # irregular de esta cuenta, 10 min mataba jobs antes del primer paso (paso
    # en engine-cron, run 32734026688). El limite real contra cuelgues va en el
    # paso; este es red de seguridad.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar aliveness de cloud-state
        id: alive
        timeout-minutes: 8
        env:
          # El input entra por env, no interpolado en el shell con ${{ }}.
          INPUT_MAX_AGE: ${{ github.event.inputs.max_age_minutes }}
        run: |
          set -euo pipefail
          MAX_AGE="${INPUT_MAX_AGE:-$DEADMAN_MAX_AGE}"
          echo "$MAX_AGE" | grep -Eq '^[0-9]+$' || {
            echo "::error::max_age_minutes no numerico: '$MAX_AGE'"; exit 1; }
          echo "max_age=$MAX_AGE" >> "$GITHUB_OUTPUT"
          if python3 scripts/cloud_state_aliveness.py --max-age-minutes "$MAX_AGE"; then
            echo "status=fresh" >> "$GITHUB_OUTPUT"
            # Histeresis para el cierre: solo se cierra el incidente cuando el
            # snapshot esta CLARAMENTE fresco (mitad del umbral). Sin esto, una
            # edad oscilando alrededor del umbral genera churn abrir/cerrar.
            if python3 scripts/cloud_state_aliveness.py --max-age-minutes "$((MAX_AGE / 2))" --quiet; then
              echo "clearly_fresh=true" >> "$GITHUB_OUTPUT"
            else
              echo "clearly_fresh=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "status=stale" >> "$GITHUB_OUTPUT"
            echo "clearly_fresh=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cloud-state estancado (dead-man activado)"
          fi

      - name: Abrir/actualizar incidente si está STALE
        if: steps.alive.outputs.status == 'stale'
        uses: actions/github-script@v7
        env:
          # El umbral que este run uso de verdad (input o default), para que el
          # issue no mienta cuando se dispara a mano con otro valor.
          EFFECTIVE_MAX_AGE: ${{ steps.alive.outputs.max_age }}
        with:
          script: |
            const label = process.env.DEADMAN_LABEL;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const titlePrefix = `🚨 cloud-state dead-man: `;
            const today = new Date().toISOString().split('T')[0];

            // Crear la etiqueta si falta (idempotente).
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label,
                color: 'B60205',
                description: 'Dead-man de engine-cron: cloud-state dejó de publicarse'
              });
            } catch (e) { /* ya existe */ }

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 10
            });
            const open = existing.data.find(i => i.title.startsWith(titlePrefix));

            const body = `## Dead-man de engine-cron activado (${today})\n\n` +
              `- **Cuándo:** ${new Date().toISOString()}\n` +
              `- **Qué:** \`data/cloud_state.json\` en la rama \`cloud-state\` lleva > ${process.env.EFFECTIVE_MAX_AGE} min sin actualizarse.\n` +
              `- **Impacto:** La vitrina pública de Marketing y el daily-analysis de Product se rompen (fallo #270).\n` +
              `- **Acción sugerida:** verificar que \`engine-cron\` esté corriendo y empujando a \`cloud-state\`; revisar los últimos runs de \`engine-cron\` y \`cloud-state-deadman\`.\n\n` +
              `Este issue se actualiza solo (no se duplica) mientras persista el estancamiento; se cierra automáticamente cuando el snapshot vuelva a estar fresco.`;

            if (open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.number, body: `Re-detectado estancamiento: ${new Date().toISOString()}`
              });
              console.log(`Issue existente actualizado: #${open.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: titlePrefix + today, body, labels: [label, 'triage', 'P1']
              });
              console.log(`Issue creado: #${created.data.number}`);
            }

      - name: Reanimar engine-cron si está STALE (auto-heal)
        # Si el schedule de 15 min está siendo throttleado (fallo #270 / incidente
        # 2026-08-27), el dead-man ya solo abría el issue y esperaba 9h a que alguien
        # pinchara engine-cron. Ahora, al confirmar STALE, disparamos engine-cron para
        # que publique un snapshot fresco; el cierre de #315 lo hace el paso de
        # "clearly_fresh" del PRÓXIMO run (no este), respetando la histéresis.
        # engine-cron usa `concurrency: group: engine-cron, cancel-in-progress: false`,
        # así que dispararlo mientras otro corre solo encola — es seguro.
        if: steps.alive.outputs.status == 'stale'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning::cloud-state stale — disparando engine-cron para auto-recuperar"
          gh workflow run engine-cron.yml --ref main -f cycles=1
          echo "engine-cron disparado; el próximo ciclo publicará snapshot fresco y #315 se cerrará solo."

      - name: Cerrar incidente si volvió a estar CLARAMENTE fresco
        if: steps.alive.outputs.clearly_fresh == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = process.env.DEADMAN_LABEL;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const titlePrefix = `🚨 cloud-state dead-man: `;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 10
            });
            for (const i of existing.data.filter(x => x.title.startsWith(titlePrefix))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: i.number,
                body: `✅ cloud-state volvió a estar fresco (${new Date().toISOString()}). Cerrando incidente.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: i.number, state: 'closed'
              });
              console.log(`Issue #${i.number} cerrado (snapshot fresco).`);
            }
