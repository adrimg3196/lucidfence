name: daily-analysis

# Capa 2 - Juicio: cada dia a las 09:00 UTC analiza lo que detectaron
# los crons de vigilia y escribe un issue de analisis con propuestas.
#
# No ejecuta nada - solo analiza y propone. Buena accion = decide
# que hacer; mala accion = sugiere algo que el humano decide descartar.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cargar snapshot desde la rama recon-state
        run: bash scripts/load_recon_snapshot.sh data/recon/latest_recon.txt origin recon-state

      - name: Instalar deps
        run: python -m pip install -r requirements.txt

      - name: Recopilar datos del dia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          echo "=== Incidentes del dia ==="
          gh issue list --repo adrimg3196/lucidfence --state open --label "monitor-incident" --search "$TODAY" --json title --jq '.[] | "  - " + .title' 2>/dev/null || echo "  (no hay incidentes)"
          echo ""
          echo "=== Issues abiertos ==="
          gh issue list --repo adrimg3196/lucidfence --state open --json number --jq 'length' 2>/dev/null || echo "0"
          echo ""
          echo "=== PRs abiertos ==="
          gh pr list --repo adrimg3196/lucidfence --state open --json number,title --jq '.[] | "  - #\(.number) \(.title)"' 2>/dev/null || echo "  (no hay PRs)"
          echo ""
          echo "=== Recon social (último snapshot) ==="
          if [ -f data/recon/latest_recon.txt ]; then
            echo "  (disponible, $(wc -l < data/recon/latest_recon.txt) líneas)"
            head -30 data/recon/latest_recon.txt
          else
            echo "  (no disponible — el recon-social-cron aún no ha corrido)"
          fi
          echo ""
          echo "=== Deps outdated ==="
          pip list --outdated --format=columns 2>/dev/null | tail -n +3 | head -10 || echo "  (no disponible)"

      - name: Escribir informe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          INCIDENTS_LOG=$(gh issue list --repo adrimg3196/lucidfence --state open --label "monitor-incident" --search "$TODAY" --json title --jq '.[] | "  - " + .title' 2>/dev/null || echo "(no hay incidentes)")
          TOTAL=$(gh issue list --repo adrimg3196/lucidfence --state open --json number --jq 'length' 2>/dev/null || echo "desconocido")
          PRS_LOG=$(gh pr list --repo adrimg3196/lucidfence --state open --json number,title --jq '.[] | "  - #\(.number) \(.title)"' 2>/dev/null || echo "(no hay PRs)")
          DEPS_LOG=$(pip list --outdated --format=columns 2>/dev/null | tail -n +3 | awk '{print "  - " $1 " -> " $3}' || echo "(no disponible)")
          RECON_SNAPSHOT=""
          if [ -f data/recon/latest_recon.txt ]; then
            RECON_SNAPSHOT=$(head -40 data/recon/latest_recon.txt | sed 's/^/    /')
          fi
          N_HOY=$(echo "$INCIDENTS_LOG" | grep -c '  - ' || echo "0")
          BODY="## Informe diario ${TODAY}\n\nIncidentes hoy: ${N_HOY} detectados\n${INCIDENTS_LOG}\n\nIssues abiertos: ${TOTAL}\n\nPRs abiertos:\n${PRS_LOG}\n\nRecon social (último snapshot):\n${RECON_SNAPSHOT:-(no disponible)}\n\nDependencias:\n${DEPS_LOG}\n\nPropuestas:\n- Revisar y cerrar incidentes resueltos\n- Evaluar PRs listos para merge\n- Planificar update de dependencias criticas\n"
          EXISTING=$(gh issue list --repo adrimg3196/lucidfence --state open --label "daily-analysis" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Actualizando issue #${EXISTING}"
            gh issue comment "${EXISTING}" --repo adrimg3196/lucidfence --body "${BODY}"
          else
            echo "Creando issue diario"
            gh issue create --repo adrimg3196/lucidfence --title "Informe diario ${TODAY}" --body "${BODY}" --label "daily-analysis,triage"
          fi
