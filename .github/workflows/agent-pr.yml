name: agent-pr

on:
  push:
    branches: ["agent/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: abrir PR si no existe
        env:
          GH_TOKEN: ${{ secrets.AGENTS_GITHUB_PAT }}
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            title="$(git log -1 --format=%s)"
            gh pr create --head "$branch" --base main --title "$title" --label agent --body-file .github/pull_request_template.md
          fi
