# Raíl de entrega de la flota (1/2): abrir la PR.
#
# Las sesiones cron de los loops pueden hacer `git push` a su rama claude/*
# pero no siempre tienen API de GitHub para abrir la PR. Este workflow cierra
# ese hueco: en cada push a claude/** abre la PR contra main si no existe.
#
# Usa el PAT del propietario guardado como Actions Secret AGENTS_GITHUB_PAT
# (cifrado; jamás en el repo). Con un PAT (no GITHUB_TOKEN) la PR creada SÍ
# dispara la CI (`pull_request`), que es el gate. Sin el secret, el workflow
# no hace nada y lo dice en el log.
name: Agent PR
on:
  push:
    branches: ['claude/**']

permissions: {}

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir PR si no existe
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          HAVE_PAT: ${{ secrets.AGENTS_GITHUB_PAT != '' }}
        with:
          github-token: ${{ secrets.AGENTS_GITHUB_PAT || github.token }}
          script: |
            if (process.env.HAVE_PAT !== 'true') {
              core.notice('AGENTS_GITHUB_PAT no configurado; raíl de entrega inactivo (añádelo en Settings → Secrets and variables → Actions).');
              return;
            }
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const {data: prs} = await github.rest.pulls.list({owner, repo, state: 'open', head: `${owner}:${branch}`});
            if (prs.length) { core.info(`PR ya abierta: #${prs[0].number}`); return; }
            const cmp = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `main...${branch}`});
            if (cmp.data.ahead_by === 0) { core.info('sin commits nuevos sobre main'); return; }
            const {data: head} = await github.rest.repos.getCommit({owner, repo, ref: branch});
            const title = head.commit.message.split('\n')[0].slice(0, 120);
            const body = [
              'PR abierta automáticamente por el raíl de entrega de la flota (`agent-pr.yml`)',
              `desde \`${branch}\` (${cmp.data.ahead_by} commit(s) sobre main).`,
              '',
              'Gate QA: la CI de esta PR es el veredicto; `agent-automerge.yml` la mergea en verde.',
              'Contrato: `docs/internal/LOOP.md` (auto-merge total en verde; outreach excluido).',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const {data: pr} = await github.rest.pulls.create({owner, repo, base: 'main', head: branch, title, body});
            core.notice(`PR abierta: #${pr.number} (${title})`);
