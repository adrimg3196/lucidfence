name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-lint:
    name: go-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.2 }

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: tests, arquitectura y suelos de cobertura
        run: scripts/coverage.sh

  web:
    name: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: web-dist, path: internal/web/dist, retention-days: 1 }

  battery:
    name: battery
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@v7
        with: { name: web-dist, path: internal/web/dist }
      - name: el artefacto web-dist trae el dashboard
        run: test -f internal/web/dist/index.html
      - name: compilar binario con dashboard embebido
        run: CGO_ENABLED=0 go build -trimpath -o bin/lucidfence ./cmd/lucidfence
      - name: batería runtime
        run: scripts/battery.sh bin/lucidfence

  security:
    name: security
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && govulncheck ./...
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # Las devDependencies (build/test tooling, no código que se sirve) se
      # auditan aparte en un job programado (M5); aquí solo el runtime.
      - run: cd web && npm ci --ignore-scripts && npm audit --audit-level=high --omit=dev

  e2e:
    name: e2e
    needs: [web]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/download-artifact@v7
        with: { name: web-dist, path: internal/web/dist }
      - name: compilar binario con dashboard
        working-directory: .
        run: CGO_ENABLED=0 go build -trimpath -o bin/lucidfence ./cmd/lucidfence
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }
