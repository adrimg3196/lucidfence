name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python:
    name: Python tests (3.11)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --require-hashes -r requirements.lock
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Run test suite
        env:
          LUCIDFENCE_PERF_P95_S: "0.5"  # runners CI compartidos ~10x más lentos que local
        run: python3 tests/run_tests.py

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check app.js
        run: |
          node --check static/app.js
          node --check static/i18n.js

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install pip-audit
      - run: pip-audit -r requirements.lock
      - name: Generate CycloneDX SBOM
        run: python3 scripts/generate_sbom.py --out sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: lucidfence-sbom
          path: sbom.cdx.json

  runtime-artifacts:
    name: No runtime artifacts in PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # data/cloud_state.json lo republica engine-cron en main cada hora (lo
      # sirve GitHub Pages). Si una rama tambien lo toca, el conflicto de
      # contenido con main es seguro y bloquea el merge — el mismo deadlock
      # del issue #74 por otra via.
      - name: Reject changes to files published by main
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- data/cloud_state.json)
          if [ -n "$changed" ]; then
            echo "::error::data/cloud_state.json es un snapshot que publica engine-cron en main." >&2
            echo "Restauralo en la rama: git checkout origin/$BASE_REF -- data/cloud_state.json" >&2
            exit 1
          fi

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
