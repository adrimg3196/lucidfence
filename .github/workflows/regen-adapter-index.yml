name: regen-adapter-index

# Post-merge safety net (y gate pre-merge) para lucidfence/plugins/adapters/index.json.
#
# Problema: el driver custom `regen-adapter-index` declarado en .gitattributes
# solo actúa en merges LOCALES; GitHub NO ejecuta drivers de merge custom en el
# merge server-side. En el merge train (#118, MODO DRENAJE) dos PRs que tocan
# adapters/index.json a la vez pueden dejar el índice obsoleto o en conflicto,
# rompiendo
# tests/test_annual_roadmap.py::test_adapter_marketplace_manifest_is_hash_verified.
#
# Solución duradera (esta CI), que no depende del driver custom:
#   - push a main: regenera el índice desde los .py mergeados y, si quedó
#     obsoleto/conflictado, hace commit+push de la corrección (o abre un PR de
#     corrección si el push está bloqueado). Sin intervención manual.
#   - pull_request a main: regenera y compara con el index.json commiteado;
#     si difiere, FALLA el check para que el autor lo regenere antes de mergear.
#
# Idempotente: si el índice ya está correcto no hay commit ni push, así el push
# de la propia corrección no re-dispara un bucle. La concurrency serializa los
# merges del train para no pisarse.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: regen-adapter-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # En push a main necesitamos poder pushear la corrección.
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Regenerar index.json y detectar desvío
        id: regen
        run: |
          python3 scripts/build_adapter_index.py
          if git diff --quiet -- lucidfence/plugins/adapters/index.json; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            echo "index.json ya está actualizado"
          else
            echo "status=dirty" >> "$GITHUB_OUTPUT"
            echo "::warning::index.json obsoleto/conflictado; regenerado desde los .py mergeados"
            git --no-pager diff --stat -- lucidfence/plugins/adapters/index.json
          fi

      - name: Verificar hash del índice regenerado
        # Espejo de tests/test_annual_roadmap.py::test_adapter_marketplace_manifest_is_hash_verified:
        # valida que cada entry del índice coincide con el sha256 del .py real.
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from lucidfence.core.adapter_marketplace import verify_index
          r = verify_index(Path("."))
          print("verify_index ->", r)
          sys.exit(0 if r["ok"] else 1)
          PY

      - name: PR gate — fallar si el índice commiteado está obsoleto
        if: ${{ github.event_name == 'pull_request' && steps.regen.outputs.status == 'dirty' }}
        run: |
          echo "::error::lucidfence/plugins/adapters/index.json está desactualizado respecto a los adapters .py."
          echo "Corrígelo en tu rama con: python3 scripts/build_adapter_index.py"
          exit 1

      - name: Push de la corrección a main
        if: ${{ github.event_name == 'push' && steps.regen.outputs.status == 'dirty' }}
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lucidfence/plugins/adapters/index.json
          git commit -m "ci: regenerar adapters/index.json tras merge a main

          Regen automático desde scripts/build_adapter_index.py (workflow
          regen-adapter-index). Garantiza que el sha256 verificado por
          tests/test_annual_roadmap.py::test_adapter_marketplace_manifest_is_hash_verified
          coincida tras merges server-side que no corren el driver custom."
          if git push origin HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::push a main bloqueado; se abrirá un PR de corrección"
          fi

      - name: Abrir PR de corrección si el push está bloqueado
        if: ${{ github.event_name == 'push' && steps.regen.outputs.status == 'dirty' && steps.push.outputs.pushed == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="ci/regen-adapter-index-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "ci: regenerar adapters/index.json (corrección manual necesaria)" || true
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "ci: regenerar adapters/index.json tras merge" \
            --body "El workflow regen-adapter-index detectó un index.json obsoleto/conflictado tras merge a main y no pudo pushear la corrección automática. Este PR la aplica." \
            || echo "::warning::no se pudo abrir el PR de corrección"
