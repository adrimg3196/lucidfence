name: loop-audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un force-push sobre un run de PR en vuelo lo deja corriendo contra una ref
# que ya no existe: el run muere en `failure` y GitHub manda correo al dueño
# por un fallo que no dice nada (pasó: gitleaks contra sha huérfano, run
# 32757168118). Con cancel-in-progress el run superado se CANCELA, y los
# cancelados no generan correo. En pushes a main no se cancela: verificar main
# entero, aunque llegue otro push detrás.
concurrency:
  group: loop-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Loop readiness audit
        run: npx -y @cobusgreyling/loop-audit . --md
        continue-on-error: true
