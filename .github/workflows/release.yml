name: release

# Crea un GitHub Release al pushear un tag semver v<MAJOR>.<MINOR>.<PATCH>,
# con el body extraído de CHANGELOG.md y el tarball de scripts/build.sh como
# asset. El asset es lo que instalan la fórmula Homebrew y el CTA de descarga
# de la landing: la release deja de ser un paso manual que se olvida (tap y
# fórmula llegaron a quedarse 3 versiones por detrás).
#
# Reglas de operación (heredadas del workflow original):
# - Los tags se crean desde main, no desde ramas de feature.
# - Ningún release contiene secrets, credenciales o data de tenants reales:
#   scripts/build.sh excluye brand/, config de agentes y datos operativos.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    # Vía merge: tocar .release-version en un PR y mergearlo a main publica la
    # release de esa versión (softprops crea el tag vía API si no existe, y el
    # guard de abajo hace el trigger idempotente si el fichero se toca sin
    # cambiar de versión). Es el canal principal: el proxy de las sesiones de
    # agente no puede pushear refs/tags ni disparar workflow_dispatch por API,
    # pero mergear un PR sí funciona.
    branches: [main]
    paths: [".release-version"]
  # Vía manual (botón "Run workflow" en Actions): mismo efecto que el merge.
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semver sin la v (p.ej. 1.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Gate de regresión (t_69acb514): las 4 invariantes mecánicas de release
      # deben cumplirse antes de crear cualquier tag/release o artefacto.
      - name: Release preflight gate (mecánicas de release; debe exit 0)
        run: python3 scripts/release_preflight.py --repo "$GITHUB_WORKSPACE" --json

      - name: Resolver versión
        id: ver
        env:
          # El input entra por env: interpolado con ${{ }} en el shell, un
          # valor como '"; comando' se ejecutaria ANTES de la validacion.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(tr -d '[:space:]' < .release-version)"
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "error: versión inválida: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Guard de idempotencia y coherencia
        id: guard
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Coherencia: no se publica una versión distinta de la del código.
          # (test_version_consistency.py ya garantiza cli.py == pyproject.toml)
          py_ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$py_ver" ]; then
            echo "error: se pide release v$VERSION pero pyproject.toml declara $py_ver"
            exit 1
          fi
          # Idempotencia: si el tag ya existe en origin, la release ya salió;
          # un retoque de .release-version sin subir versión no re-publica.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "El tag v$VERSION ya existe: no hay nada que publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Mover [Unreleased] -> [version] en el CHANGELOG ANTES de leerlo, para
      # que la release nunca caiga en el fallback "Release vX.Y.Z" vacío (visto
      # en v1.5.0). El script es idempotente: si la sección ya existe, no toca.
      - name: Mover [Unreleased] -> [version] en CHANGELOG
        if: steps.guard.outputs.skip == 'false'
        run: python3 scripts/move_changelog_unreleased.py --version "${{ steps.ver.outputs.version }}"

      - name: Leer changelog
        if: steps.guard.outputs.skip == 'false'
        id: changelog
        run: |
          tag="${{ steps.ver.outputs.version }}"
          # index() y no ~: "[1.5.0]" dentro de un regex es una clase de
          # caracteres, no el literal — el body de v1.5.0 salió con el
          # fallback por esto.
          section=$(awk -v ver="## [$tag]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { found=0 }
            found { print }
          ' CHANGELOG.md)
          # El paso "Mover [Unreleased] -> [version]" garantiza que la sección
          # existe; si no la hay, es un fallo de automatización, no un fallback
          # silencioso. Antes esto producía el body vacío "Release vX.Y.Z".
          if [ -z "$section" ]; then
            if grep -qF "## [$tag]" CHANGELOG.md; then
              echo "::error::La sección [${tag}] existe pero está VACÍA:" \
                   "[Unreleased] no tenía contenido al cortar la release." \
                   "Apunta los cambios al CHANGELOG antes de re-tagear."
            else
              echo "::error::No hay sección [${tag}] en CHANGELOG.md ni" \
                   "[Unreleased] que mover. ¿Se corrió move_changelog_unreleased?"
            fi
            exit 1
          fi
          {
            echo "section<<EOF"
            echo "$section"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # El move de arriba solo vive en el workspace del runner. Sin este paso,
      # main nunca gana la sección [version]: la siguiente release renombraría
      # un [Unreleased] que aún arrastra los bullets de ESTA y re-publicaría
      # sus notas. Se persiste por el raíl normal (rama claude/** -> agent-pr
      # abre la PR -> automerge en verde), no con push directo a main, para no
      # saltarse el ruleset ni el CI. Corre DESPUÉS de "Leer changelog": así una
      # sección vacía muere en la validación antes de publicar nada (Codex #295).
      # Si el push falla, la release DEBE fallar: seguir en silencio recrearía
      # la deriva que este paso existe para evitar.
      - name: Persistir CHANGELOG movido (rama claude/ -> PR -> automerge)
        if: steps.guard.outputs.skip == 'false'
        env:
          # PAT y no GITHUB_TOKEN: GitHub SUPRIME los workflows disparados por
          # pushes hechos con el token del job, así que con GITHUB_TOKEN
          # agent-pr nunca abriría la PR y la rama quedaría huérfana — el mismo
          # drift con otra cara (Codex P1 en #295). Mismo secret que usan
          # agent-pr/agent-automerge.
          AGENTS_PAT: ${{ secrets.AGENTS_GITHUB_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG sin cambios (la sección [${VERSION}] ya estaba commiteada)"
            exit 0
          fi
          if [ -z "$AGENTS_PAT" ]; then
            echo "::error::AGENTS_GITHUB_PAT no configurado. Con GITHUB_TOKEN el" \
                 "push no dispara agent-pr (GitHub suprime workflows de pushes" \
                 "con ese token): la rama quedaría huérfana sin PR y main sin" \
                 "la sección [${VERSION}]."
            exit 1
          fi
          git config user.name "lucidfence-release[bot]"
          git config user.email "release@lucidfence.local"
          git checkout -B "claude/changelog-v${VERSION}"
          git add CHANGELOG.md
          git commit -m "docs(changelog): mover [Unreleased] a [${VERSION}] (corte de release)"
          for espera in 2 4 8 0; do
            git push --force-with-lease \
              "https://x-access-token:${AGENTS_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
              "claude/changelog-v${VERSION}" && exit 0
            [ "$espera" -eq 0 ] && break
            sleep "$espera"
          done
          echo "::error::no se pudo pushear claude/changelog-v${VERSION};" \
               "sin esto main queda sin la sección [${VERSION}] y la próxima" \
               "release re-publicaría estas notas"
          exit 1

      - name: Construir tarball versionado
        if: steps.guard.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          LUCIDFENCE_BUILD_VERSION="$VERSION" bash scripts/build.sh
          cd dist
          sha256sum "lucidfence-$VERSION.tar.gz" | tee SHA256SUMS

      - name: Smoke del artefacto (el tarball arranca de verdad)
        if: steps.guard.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p /tmp/smoke && tar -xzf "dist/lucidfence-$VERSION.tar.gz" -C /tmp/smoke
          cd "/tmp/smoke/lucidfence-$VERSION"
          python3 -m pip install --require-hashes -r requirements.lock
          python3 lucidfence/cli.py --version | grep -F "lucidfence $VERSION"
          LUCIDFENCE_DATA_DIR=/tmp/smoke/data LUCIDFENCE_PORT=8797 python3 saas_server.py &
          SRV=$!
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8797/api/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8797/ | grep -F "Command Center" >/dev/null
          kill $SRV

      - name: Crear GitHub Release con el asset
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.section }}
          files: |
            dist/lucidfence-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
