name: release

# Crea un GitHub Release al pushear un tag semver v<MAJOR>.<MINOR>.<PATCH>,
# con el body extraído de CHANGELOG.md y el tarball de scripts/build.sh como
# asset. El asset es lo que instalan la fórmula Homebrew y el CTA de descarga
# de la landing: la release deja de ser un paso manual que se olvida (tap y
# fórmula llegaron a quedarse 3 versiones por detrás).
#
# Reglas de operación (heredadas del workflow original):
# - Los tags se crean desde main, no desde ramas de feature.
# - Ningún release contiene secrets, credenciales o data de tenants reales:
#   scripts/build.sh excluye brand/, config de agentes y datos operativos.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    # Vía merge: tocar .release-version en un PR y mergearlo a main publica la
    # release de esa versión (softprops crea el tag vía API si no existe, y el
    # guard de abajo hace el trigger idempotente si el fichero se toca sin
    # cambiar de versión). Es el canal principal: el proxy de las sesiones de
    # agente no puede pushear refs/tags ni disparar workflow_dispatch por API,
    # pero mergear un PR sí funciona.
    branches: [main]
    paths: [".release-version"]
  # Vía manual (botón "Run workflow" en Actions): mismo efecto que el merge.
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semver sin la v (p.ej. 1.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolver versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(tr -d '[:space:]' < .release-version)"
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "error: versión inválida: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Guard de idempotencia y coherencia
        id: guard
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Coherencia: no se publica una versión distinta de la del código.
          # (test_version_consistency.py ya garantiza cli.py == pyproject.toml)
          py_ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$py_ver" ]; then
            echo "error: se pide release v$VERSION pero pyproject.toml declara $py_ver"
            exit 1
          fi
          # Idempotencia: si el tag ya existe en origin, la release ya salió;
          # un retoque de .release-version sin subir versión no re-publica.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "El tag v$VERSION ya existe: no hay nada que publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Leer changelog
        if: steps.guard.outputs.skip == 'false'
        id: changelog
        run: |
          tag="${{ steps.ver.outputs.version }}"
          # index() y no ~: "[1.5.0]" dentro de un regex es una clase de
          # caracteres, no el literal — el body de v1.5.0 salió con el
          # fallback por esto.
          section=$(awk -v ver="## [$tag]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { found=0 }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "warning: no se encontró sección en CHANGELOG.md para v$tag"
            section="Release v$tag"
          fi
          echo "section<<EOF" >> $GITHUB_OUTPUT
          echo "$section" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Construir tarball versionado
        if: steps.guard.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          LUCIDFENCE_BUILD_VERSION="$VERSION" bash scripts/build.sh
          cd dist
          sha256sum "lucidfence-$VERSION.tar.gz" | tee SHA256SUMS

      - name: Smoke del artefacto (el tarball arranca de verdad)
        if: steps.guard.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p /tmp/smoke && tar -xzf "dist/lucidfence-$VERSION.tar.gz" -C /tmp/smoke
          cd "/tmp/smoke/lucidfence-$VERSION"
          python3 -m pip install --require-hashes -r requirements.lock
          python3 lucidfence/cli.py --version | grep -F "lucidfence $VERSION"
          LUCIDFENCE_DATA_DIR=/tmp/smoke/data LUCIDFENCE_PORT=8797 python3 saas_server.py &
          SRV=$!
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8797/api/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8797/ | grep -F "Command Center" >/dev/null
          kill $SRV

      - name: Crear GitHub Release con el asset
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.section }}
          files: |
            dist/lucidfence-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
