name: nightly-health-check

# Verifica que la vitrina pública de LucidFence esté reach able cada día.
# No requiere credenciales, servidor local, ni gh CLI.
# Falla si la vitrina no responde en 30s — eso es suficiente para alertar.
#
# El check es contra el estado publicado (data/cloud_state.json vía
# raw.githubusercontent.com), no contra el servidor local.

on:
  schedule:
    - cron: "0 8 * * *"            # 08:00 UTC cada día
  workflow_dispatch:                # permitido forzar manualmente

permissions:
  contents: read

# Un cron sin concurrency puede solaparse consigo mismo y multiplicar fallos.
concurrency:
  group: nightly-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # OJO con este numero: `timeout-minutes` de JOB cuenta tambien el tiempo que
    # el job pasa ESPERANDO runner, no solo ejecutando. En una cuenta gratuita
    # los runs de `schedule` ya llegan con retraso y la cola puede pasar de 10
    # min. Cuando salta, el job queda `cancelled` pero el RUN queda `failure`,
    # y un run de `schedule` en `failure` manda correo al propietario: un
    # hipo de infraestructura disfrazado de fallo del repo (pasó: run 32734026688,
    # 15 min en cola, cero pasos ejecutados). El limite util contra CUELGUES va
    # a nivel de PASO, que solo corre cuando ya hay runner; el de job se queda
    # como red de seguridad holgada.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar vitrina (URL + esquema, fuente única)
        timeout-minutes: 10
        # scripts/check_vitrina.py es EL verificador: URL canónica + esquema
        # importado del publisher. Sin copias inline que puedan derivar.
        run: python3 scripts/check_vitrina.py
