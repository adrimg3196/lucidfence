name: publish-to-pypi

# Publica el paquete a PyPI cuando se push de un tag semver.
# El tag debe ser v<MAJOR>.<MINOR>.<PATCH> (ej: v1.4.0).
# El paquete se construye desde pyproject.toml y se publica a PyPI
# usando un token de publicación (PYPI_TOKEN) configurado en secrets.
#
# Regla: solo se publica desde main, nunca desde ramas de feature.
# El release.yml crea el GitHub Release; este workflow publica el pip package.
#
# Policy: ningún release contiene secrets, credenciales, o data de tenants reales.
# El wheel/sdist es solo el código fuente + LICENSE + README.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install --require-hashes -r requirements.lock

      # Gate de regresión (t_69acb514): las 4 invariantes mecánicas de release
      # deben cumplirse antes de `twine upload`. El secreto (PYPI_TOKEN) es WARN.
      - name: Publish preflight gate (mecánicas de release; debe exit 0)
        run: python3 scripts/release_preflight.py --repo "$GITHUB_WORKSPACE" --json

      - name: Build package
        run: python -m build

      - name: Generate SBOM and provenance for package
        run: |
          mkdir -p build/provenance
          artifact="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python3 scripts/generate_sbom.py --out build/provenance/sbom.cdx.json
          openssl genpkey -algorithm Ed25519 -out build/provenance/release_signing.key
          openssl pkey -in build/provenance/release_signing.key -pubout -out build/provenance/release_signing.pub
          python3 scripts/provenance_attest.py \
            --artifact "$artifact" \
            --sbom build/provenance/sbom.cdx.json \
            --key build/provenance/release_signing.key \
            --out build/provenance/provenance.dsse.json \
            --repo "$GITHUB_WORKSPACE"
          python3 scripts/release_preflight.py \
            --repo "$GITHUB_WORKSPACE" \
            --artifact "$artifact" \
            --sbom build/provenance/sbom.cdx.json \
            --dsse build/provenance/provenance.dsse.json \
            --key build/provenance/release_signing.pub \
            --json

      - name: Upload PyPI provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-provenance
          path: |
            build/provenance/sbom.cdx.json
            build/provenance/provenance.dsse.json
            build/provenance/release_signing.pub
          if-no-files-found: error

      - name: Verify package (twine check)
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::PYPI_TOKEN no configurado. El flujo de publicación no se ejecutará hasta que se configure el secret."
            echo "::warning::Pasos para configurar:"
            echo "::warning::  1. Crear cuenta en https://pypi.org/account/register/"
            echo "::warning::  2. Crear API token en https://pypi.org/manage/account/token/"
            echo "::warning::  3. Añadir el secret PYPI_TOKEN en Settings > Secrets > Actions"
            exit 0  # no falla el workflow, solo avisa
          fi
          python -m twine upload dist/*
