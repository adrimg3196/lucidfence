name: release-preflight

# Regression GATE for the mechanical release/deploy findings in t_69acb514.
# Runs on every push to main and every PR so the 4 mechanical invariants can
# never silently regress (they did once: __version__ drifted to 1.3.1, CHANGELOG
# lost [Unreleased], .worktrees leaked into the build image, and every deploy
# layer had zero healthchecks). The domain-secret finding (PYPI_TOKEN) is a
# WARN only and never fails this gate — it is owned by a human.
#
# Also wired directly into release.yml (pre-tag), deploy-fly.yml (pre-deploy)
# and publish-pypi.yml (pre-upload). This job is the continuous backstop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # No third-party deps: the script is stdlib-only. `$GITHUB_WORKSPACE`
      # makes --repo unnecessary, but pass it explicitly for clarity.
      - name: Run release preflight gate (must exit 0)
        run: python3 scripts/release_preflight.py --repo "$GITHUB_WORKSPACE" --json
