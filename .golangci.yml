version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
    - funlen
    - gocyclo
    - unparam
  # misspell no está habilitado: el código y sus comentarios están en
  # español (spec, "textos ... en español"), y misspell asume inglés incluso
  # con locale: US e ignore-rules vacío (marca "dependencias" y "producto"
  # como erratas de palabras inglesas). No hay forma de decirle "este
  # fichero es español" sin una lista de excepciones que crece con cada
  # comentario nuevo, así que se apaga en vez de perseguir falsos positivos.
  settings:
    funlen:
      lines: 60
      statements: 40
    gocyclo:
      min-complexity: 15
    depguard:
      rules:
        domain:
          list-mode: strict
          files: ["**/internal/domain/**"]
          allow: ["$gostd", "github.com/adrimg3196/lucidfence/internal/domain"]
        uem:
          list-mode: strict
          files: ["**/internal/uem/**"]
          allow: ["$gostd", "github.com/adrimg3196/lucidfence/internal/domain", "github.com/adrimg3196/lucidfence/internal/uem"]
        store:
          list-mode: strict
          files: ["**/internal/store/**"]
          allow: ["$gostd", "github.com/adrimg3196/lucidfence/internal/domain"]
        leaf-services:
          list-mode: strict
          files: ["**/internal/notify/**", "**/internal/posture/**", "**/internal/reports/**"]
          allow: ["$gostd", "github.com/adrimg3196/lucidfence/internal/domain", "github.com/adrimg3196/lucidfence/internal/store"]
        engine:
          list-mode: strict
          files: ["**/internal/engine/**"]
          allow:
            - "$gostd"
            - "github.com/adrimg3196/lucidfence/internal/domain"
            - "github.com/adrimg3196/lucidfence/internal/uem"
            - "github.com/adrimg3196/lucidfence/internal/store"
            - "github.com/adrimg3196/lucidfence/internal/notify"
            - "github.com/adrimg3196/lucidfence/internal/posture"
            - "github.com/adrimg3196/lucidfence/internal/config"
        auth:
          list-mode: strict
          files: ["**/internal/auth/**"]
          allow: ["$gostd", "github.com/adrimg3196/lucidfence/internal/domain", "github.com/adrimg3196/lucidfence/internal/store", "golang.org/x/crypto"]
        api:
          list-mode: strict
          files: ["**/internal/api/**"]
          allow:
            - "$gostd"
            - "github.com/adrimg3196/lucidfence/internal/engine"
            - "github.com/adrimg3196/lucidfence/internal/auth"
            - "github.com/adrimg3196/lucidfence/internal/store"
            - "github.com/adrimg3196/lucidfence/internal/reports"
            - "github.com/adrimg3196/lucidfence/internal/domain"
            - "github.com/adrimg3196/lucidfence/internal/uem"
            - "github.com/adrimg3196/lucidfence/internal/config"
            - "github.com/adrimg3196/lucidfence/internal/version"
          deny:
            - pkg: "github.com/adrimg3196/lucidfence/internal/uem/"
              desc: "api nunca importa un conector concreto (spec §5.2)"
        mcp:
          list-mode: strict
          files: ["**/internal/mcp/**"]
          allow: ["$gostd", "github.com/adrimg3196/lucidfence/internal/api"]
        migrate:
          list-mode: strict
          files: ["**/internal/migrate/**"]
          allow: ["$gostd", "github.com/adrimg3196/lucidfence/internal/domain", "github.com/adrimg3196/lucidfence/internal/store", "github.com/adrimg3196/lucidfence/internal/uem"]
        leaf-utils:
          list-mode: strict
          files: ["**/internal/web/**", "**/internal/version/**", "**/internal/config/**", "**/internal/arch/**", "**/internal/battery/**"]
          allow: ["$gostd"]
        # Sin regla comodín: cada paquete bajo internal/ debe tener su regla
        # explícita; lo exige TestDepguardCubreTodosLosPaquetes.

formatters:
  enable:
    - gofmt
    - goimports
