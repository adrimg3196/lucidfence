# LucidFence — gitleaks config
# Escaneo de secretos en CI (capa 2 de defensa, además del pre-commit local).
# Reglas por defecto de gitleaks + allowlist de placeholders/documentación.

title = "LucidFence gitleaks config"

[extend]
# Usa las reglas integradas de gitleaks (AWS, GitHub, OpenAI, Stripe, etc.)
useDefault = true

[allowlist]
# No alertar sobre placeholders de ejemplo ni binarios de diagramas.
# NOTA (hardening SOC 2026-08-22, hallazgo #2): antes se excluían directorios
# completos (docs/, README.md, reports/, tests/) y eso podía enmascarar un
# secreto REAL commiteado en esas rutas. Ahora NO se excluyen directorios:
# docs/, README.md, reports/ y tests/ SE ESCANEAN. Solo se excluyen: (a) el
# .env.example que solo tiene placeholders, y (b) binarios de imagen en
# docs/reports (no contienen secretos detectables). .github/ ya NO está en la
# allowlist (SOC audit 2026-08-20, L-3) porque es donde viven los secretos de
# CI (deploy/PATs de publish-pypi/publish-pages).
description = "Allowlist de placeholders y binarios sin secretos reales"
paths = [
    '''.*\.env\.example$''',
    '''.*docs/.*\.(png|svg|jpe?g|gif|webp|ico)$''',
    '''.*reports/.*\.(png|svg|jpe?g|gif|webp|ico)$''',
]
regexes = [
    # placeholders tipo <INSERT_...> o TU_ALGO
    '''<[A-Z_]+>''',
    '''TU_[A-Z_]+''',
    '''example\.com''',
    '''acme\.test''',
    '''your-org''',
    '''adrimg3196''',
    # tokens de mentira usados en tests (no reales) — evita falsos positivos
    # sin tener que excluir todo el directorio tests/. Patrón literal, no
    # directorio: cualquier OTRO secreto en tests/ sí se detecta.
    '''longenoughkey123''',
    '''MuemQa123456''',          # test_multiuem_register.py (password fake)
    '''fleet-tok-SECRET-abc123''',  # test_multiuem_register.py (FLEET_SECRET fake)
]
