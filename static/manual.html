<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LucidFence · Manual interactivo</title>
<style>
  :root{--bg:#0b0e14;--panel:#141924;--line:#232a3a;--txt:#e6e9f0;--dim:#8b93a7;--acc:#5b7cfa;--ok:#2fbf71;--warn:#e9b949}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line)}
  header .logo{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font-weight:700}
  header h1{font-size:16px}
  header .sub{color:var(--dim);font-size:12px}
  #bar{height:3px;background:var(--line)}
  #fill{height:100%;width:0;background:var(--acc);transition:width .25s}
  main{flex:1;display:flex;min-height:0}
  nav{width:230px;border-right:1px solid var(--line);padding:14px 0;overflow-y:auto;flex-shrink:0}
  nav button{display:block;width:100%;text-align:left;padding:9px 18px;background:none;border:none;color:var(--dim);font:inherit;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
  nav button:hover{color:var(--txt)}
  nav button.on{color:var(--txt);border-left-color:var(--acc);background:rgba(91,124,250,.08)}
  section{flex:1;overflow-y:auto;padding:26px 34px;max-width:1000px}
  section h2{font-size:21px;margin-bottom:4px}
  section .step-n{color:var(--acc);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  section p{margin:12px 0;color:#c6ccda}
  section img{width:100%;border:1px solid var(--line);border-radius:10px;margin:14px 0;cursor:zoom-in}
  section img.zoom{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:rgba(4,6,10,.96);z-index:9;border:none;border-radius:0;cursor:zoom-out;margin:0}
  .tip{border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14px;color:#c6ccda}
  .tip.warn{border-left-color:var(--warn)}
  code{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}
  footer{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-top:1px solid var(--line)}
  footer button{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 18px;border-radius:8px;font:inherit;cursor:pointer}
  footer button:hover{border-color:var(--acc)}
  footer button:disabled{opacity:.35;cursor:default}
  footer .hint{color:var(--dim);font-size:12px}
  @media(max-width:760px){nav{display:none}section{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="logo">🛰</div>
  <div><h1>Manual de LucidFence</h1><div class="sub">Interactivo · con capturas reales del producto · ←/→ para navegar</div></div>
</header>
<div id="bar"><div id="fill"></div></div>
<main>
  <nav id="nav"></nav>
  <section id="content"></section>
</main>
<footer>
  <button id="prev">← Anterior</button>
  <span class="hint" id="pos"></span>
  <button id="next">Siguiente →</button>
</footer>
<script src="manual.js"></script>
</body>
</html>
