<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LucidFence · Manual interactivo</title>
<link rel="stylesheet" href="design.css" />
<style>
  /* Tokens, tipografia y superficies del navegador: /static/design.css.
     Esta superficie usa el tema OSCURO del producto; antes llevaba su
     propio :root con otra paleta y otra familia. */
  *{margin:0}
  body{font-size:var(--t-md);line-height:var(--lh-prose);min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border)}
  header .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:700}
  header h1{font-size:var(--t-lg)}
  header .sub{color:var(--muted);font-size:var(--t-xs)}
  #bar{height:3px;background:var(--border)}
  #fill{height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;transition:transform var(--dur-slow) var(--ease)}
  main{flex:1;display:flex;min-height:0}
  nav{width:230px;border-right:1px solid var(--border);padding:14px 0;overflow-y:auto;flex-shrink:0}
  nav button{display:block;width:100%;text-align:left;padding:9px 18px;background:none;border:none;color:var(--muted);font:inherit;font-size:var(--t-sm);cursor:pointer;border-left:2px solid transparent}
  nav button:hover{color:var(--fg)}
  nav button.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
  section{flex:1;overflow-y:auto;padding:26px 34px;max-width:1000px}
  section h2{font-size:var(--t-xl);margin-bottom:4px}
  section .step-n{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  section p{margin:12px 0;color:var(--fg-2)}
  section img{width:100%;border:1px solid var(--border);border-radius:10px;margin:14px 0;cursor:zoom-in}
  section img.zoom{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:rgba(4,6,10,.96);z-index:9;border:none;border-radius:0;cursor:zoom-out;margin:0}
  .tip{position:relative;border:1px solid var(--border);border-radius:8px;padding:10px 14px 10px 30px;margin:12px 0;font-size:var(--t-md);color:var(--fg-2)}
  .tip:before{content:"";position:absolute;left:13px;top:1.05em;width:7px;height:7px;border-radius:50%;background:var(--green)}
  .tip.warn:before{background:var(--amber)}
  code{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
  footer{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-top:1px solid var(--border)}
  footer button{background:var(--panel);border:1px solid var(--border);color:var(--fg);padding:9px 18px;border-radius:8px;font:inherit;cursor:pointer}
  footer button:hover{border-color:var(--accent)}
  footer button:disabled{opacity:.35;cursor:default}
  footer .hint{color:var(--muted);font-size:12px}
  @media(max-width:760px){nav{display:none}section{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="logo">🛰</div>
  <div><h1 id="title">Manual de LucidFence</h1><div class="sub" id="sub">Interactivo · con capturas reales del producto · ←/→ para navegar</div></div>
  <button id="lang" title="Español / English" style="margin-left:auto;background:var(--panel);border:1px solid var(--border);color:var(--fg);padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer">EN</button>
</header>
<div id="bar"><div id="fill"></div></div>
<main>
  <nav id="nav"></nav>
  <section id="content"></section>
</main>
<footer>
  <button id="prev">← Anterior</button>
  <span class="hint" id="pos"></span>
  <button id="next">Siguiente →</button>
</footer>
<script src="manual.js"></script>
</body>
</html>
