# Config de ruff para LucidFence — señal, no ruido (adoptado de la pasada
# plankton 2026-08-20; ver .claude/hooks/ORIGIN.md).
#
# Solo clases de error REALES (F = flujo/nombres/imports, E9 = sintaxis).
# El estilo de la casa (compacto: `score += 10; reasons.append(...)`, imports
# tras el docstring en scripts) es deliberado y NO se lintea: E7xx/E4xx fuera.
target-version = "py310"

[lint]
select = ["F", "E9"]

[lint.per-file-ignores]
# Los __init__.py re-exportan superficie pública: F401 ahí es falso positivo.
"**/__init__.py" = ["F401"]
