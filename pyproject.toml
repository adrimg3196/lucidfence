[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "lucidfence-local"
version = "1.6.0"
description = "Local-first geofencing risk and UEM automation SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LucidFence contributors"}]
dependencies = [
  "requests>=2.31,<3",
  "PyJWT[crypto]==2.13.0",
  "cryptography==50.0.0",
  "tomli>=1.1.0; python_version < '3.11'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.scripts]
lucidfence = "lucidfence.cli:main"

[project.urls]
Homepage = "https://github.com/adrimg3196/lucidfence"
Documentation = "https://adrimg3196.github.io/lucidfence/"

[tool.setuptools.packages.find]
include = ["lucidfence*"]
exclude = ["tests*", "data*"]
