        updated_at:
          type: string
          format: date-time
      required: [schema_version, enforcement, webhook, ntfy, egress, risk, updated_at]
    SettingsValidationRequest:
      type: object
      description: >-
        Bloques que el formulario tiene en pantalla. Los ausentes se toman de
        los ajustes guardados. No acepta el secreto del webhook.
      properties:
        enforcement:
          $ref: "#/components/schemas/EnforcementSettings"
        webhook:
          $ref: "#/components/schemas/WebhookSettings"
        ntfy:
          $ref: "#/components/schemas/NtfySettings"
        egress:
          $ref: "#/components/schemas/EgressSettings"
        risk:
          $ref: "#/components/schemas/RiskSettings"
