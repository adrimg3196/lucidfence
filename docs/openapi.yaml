# Contrato de la API de LucidFence 2.0. Estilo restringido: 2 espacios de
# indentación, rutas en columna 2, métodos en columna 4 y x-capability en
# columna 6. internal/api/openapi_test.go exige paridad con el registro;
# web/ genera sus tipos desde aquí (npm run gen:api).
openapi: 3.1.0
info:
  title: LucidFence API
  version: 2.0.0-dev
  description: Geofencing multi-UEM local-first. Toda ruta declara x-capability (public o la capacidad RBAC exigida).
servers:
  - url: http://127.0.0.1:8765
paths:
  /api/v1/health:
    get:
      x-capability: public
      summary: Estado del servicio, sin secretos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/readyz:
    get:
      x-capability: public
      summary: Disponibilidad (directorio de datos escribible)
      responses:
        "200":
          description: Listo
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required: [ready]
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/status:
    get:
      x-capability: public
      summary: Indica si falta el asistente inicial
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_required:
                    type: boolean
                required: [setup_required]
  /api/v1/auth/setup:
    post:
      x-capability: public
      summary: Crea el owner (solo si no hay usuarios) y abre sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Sesión abierta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      x-capability: public
      summary: Abre sesión con cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión abierta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      x-capability: org:read
      summary: Cierra la sesión
      responses:
        "204":
          description: Cerrada
  /api/v1/auth/me:
    get:
      x-capability: org:read
      summary: Usuario, org, rol, csrf y capacidades
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/devices:
    get:
      x-capability: device:read
      summary: Lista de dispositivos
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [inside, outside, unknown]
        - name: q
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical, unknown]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
  /api/v1/devices/{id}:
    get:
      x-capability: device:read
      summary: Detalle de dispositivo
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/devices/{id}/trail:
    get:
      x-capability: device:read
      summary: Últimas posiciones
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrailPoint"
                required: [items]
  /api/v1/devices/{id}/actions:
    post:
      x-capability: device:action
      summary: Ejecuta una acción sobre un dispositivo con los guardarraíles del motor
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceActionRequest"
      responses:
        "200":
          description: Resultado de la acción, incluidas la ejecutada en dry-run y la bloqueada por un guardarraíl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/fences:
    get:
      x-capability: fence:read
      summary: Lista de geocercas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FenceList"
    post:
      x-capability: fence:write
      summary: Crea una geocerca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fence"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fence"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/fences/{id}:
    get:
      x-capability: fence:read
      summary: Detalle de geocerca
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fence"
        "404":
          $ref: "#/components/responses/Error"
    put:
      x-capability: fence:write
      summary: Sustituye una geocerca
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fence"
      responses:
        "200":
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fence"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      x-capability: fence:delete
      summary: Elimina una geocerca
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Eliminada
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/routes:
    get:
      x-capability: route:read
      summary: Lista de rutas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteList"
    post:
      x-capability: route:write
      summary: Crea una ruta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Route"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/routes/{id}:
    get:
      x-capability: route:read
      summary: Detalle de ruta
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "404":
          $ref: "#/components/responses/Error"
    put:
      x-capability: route:write
      summary: Sustituye una ruta
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Route"
      responses:
        "200":
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      x-capability: route:delete
      summary: Elimina una ruta
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Eliminada
  /api/v1/pois:
    get:
      x-capability: fence:read
      summary: Lista de puntos de interés
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POIList"
    post:
      x-capability: fence:write
      summary: Crea un POI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/POI"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POI"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/pois/geojson:
    get:
      x-capability: fence:read
      summary: POIs como FeatureCollection
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/pois/{id}:
    get:
      x-capability: fence:read
      summary: Detalle de POI
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POI"
        "404":
          $ref: "#/components/responses/Error"
    put:
      x-capability: fence:write
      summary: Sustituye un POI
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/POI"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POI"
    delete:
      x-capability: fence:delete
      summary: Elimina un POI
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Eliminado
  /api/v1/policies:
    get:
      x-capability: policy:read
      summary: Lista de políticas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
    post:
      x-capability: policy:write
      summary: Crea una política
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/policies/fields:
    get:
      x-capability: policy:read
      summary: Catálogo de campos y operadores del editor de políticas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyFieldCatalog"
  /api/v1/policies/replay:
    post:
      x-capability: policy:read
      summary: Simula una política candidata contra el histórico (solo lectura)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
      responses:
        "200":
          description: Resumen de la simulación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/policies/templates:
    get:
      x-capability: policy:read
      summary: Plantillas de política listas para usar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyTemplateList"
  /api/v1/policies/{id}:
    get:
      x-capability: policy:read
      summary: Detalle de política
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          $ref: "#/components/responses/Error"
    put:
      x-capability: policy:write
      summary: Sustituye una política
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      x-capability: policy:write
      summary: Elimina una política
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Eliminada
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/engine/status:
    get:
      x-capability: device:read
      summary: Estado del motor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"
  /api/v1/engine/run-once:
    post:
      x-capability: engine:run
      summary: Ejecuta un ciclo ahora
      responses:
        "200":
          description: Ciclo ejecutado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleStats"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/events:
    get:
      x-capability: device:read
      summary: Transiciones paginadas, de la más reciente a la más antigua
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/actions:
    get:
      x-capability: device:read
      summary: Acciones paginadas, de la más reciente a la más antigua
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPage"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/incidents:
    get:
      x-capability: incident:read
      summary: Bandeja de incidentes
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, ack, closed]
        - name: device_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
  /api/v1/incidents/analytics:
    get:
      x-capability: incident:read
      summary: Agregados de la cartera de incidentes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnalytics"
  /api/v1/incidents/export:
    get:
      x-capability: report:export
      summary: Exporta los incidentes en CSV
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, ack, closed]
        - name: device_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV con cabecera en español y Content-Disposition de descarga
          content:
            text/csv:
              schema:
                type: string
  /api/v1/incidents/{id}:
    get:
      x-capability: incident:read
      summary: Detalle de incidente
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      x-capability: incident:write
      summary: Cambia el estado del incidente y anota la auditoría
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentPatch"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/alerts:
    get:
      x-capability: incident:read
      summary: Reglas de alerta
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleList"
    post:
      x-capability: alert:write
      summary: Crea una regla de alerta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRule"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/alerts/evaluate:
    post:
      x-capability: alert:write
      summary: Vista previa; devuelve los disparos sin notificar ni persistir
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEvaluation"
  /api/v1/alerts/{id}:
    get:
      x-capability: incident:read
      summary: Detalle de regla de alerta
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "404":
          $ref: "#/components/responses/Error"
    put:
      x-capability: alert:write
      summary: Sustituye una regla de alerta
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRule"
      responses:
        "200":
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      x-capability: alert:write
      summary: Elimina una regla de alerta
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Eliminada
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/playbooks:
    get:
      x-capability: policy:read
      summary: Lista de playbooks SOAR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookList"
    post:
      x-capability: playbook:write
      summary: Crea un playbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Playbook"
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playbook"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/playbooks/{id}:
    get:
      x-capability: policy:read
      summary: Detalle de playbook
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playbook"
        "404":
          $ref: "#/components/responses/Error"
    put:
      x-capability: playbook:write
      summary: Sustituye un playbook
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Playbook"
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playbook"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      x-capability: playbook:write
      summary: Elimina un playbook
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Eliminado
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/handoffs:
    get:
      x-capability: incident:read
      summary: Bandeja de aprobaciones (pendientes primero)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, executed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffList"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/handoffs/{id}/approve:
    post:
      x-capability: handoff:approve
      summary: Aprueba un handoff y ejecuta su acción pasando por los guardarraíles
      description: >-
        Un bloqueo del guardarraíl responde 200 con el resultado bloqueado
        dentro. Una supresión por cooldown responde 409 code=cooldown con
        detail.retry_after: la acción no llegó a ejecutarse, pero la decisión ya
        está sellada, la petición se queda en approved sin result y una segunda
        aprobación responde 409 code=conflict.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffDecision"
      responses:
        "200":
          description: Handoff decidido, con el resultado de la ejecución dentro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/handoffs/{id}/reject:
    post:
      x-capability: handoff:approve
      summary: Rechaza un handoff sin tocar el dispositivo
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffDecision"
      responses:
        "200":
          description: Handoff rechazado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/settings:
    get:
      x-capability: engine:config
      summary: Ajustes de la organización; los secretos nunca salen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /api/v1/settings/enforcement:
    put:
      x-capability: engine:config
      summary: Cambia solo el bloque de enforcement y lo pone en vigor en el acto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnforcementSettings"
      responses:
        "200":
          description: Ajustes completos ya vigentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/settings/webhooks:
    put:
      x-capability: engine:config
      summary: Cambia solo el bloque de webhook; secret es de solo escritura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSettingsUpdate"
      responses:
        "200":
          description: Ajustes completos ya vigentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/settings/ntfy:
    put:
      x-capability: engine:config
      summary: Cambia solo el canal ntfy; token es de solo escritura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NtfySettingsUpdate"
      responses:
        "200":
          description: Ajustes completos ya vigentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/settings/egress:
    put:
      x-capability: engine:config
      summary: Cambia solo la allowlist de egress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EgressSettings"
      responses:
        "200":
          description: Ajustes completos ya vigentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/settings/risk:
    put:
      x-capability: engine:config
      summary: Cambia solo el contexto de riesgo (turnos, riesgo por zona y franja nocturna)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskSettings"
      responses:
        "200":
          description: Ajustes completos ya vigentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/settings/validate:
    post:
      x-capability: engine:config
      summary: Comprueba los ajustes y las URLs de salida sin guardar ni enviar nada
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsValidationRequest"
      responses:
        "200":
          description: Veredicto por canal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsValidation"
        "400":
          $ref: "#/components/responses/Error"
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto como next_cursor por la página anterior. Ausente empieza por lo más reciente.
      schema:
        type: string
  responses:
    Error:
      description: Error con forma única
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        detail: {}
      required: [error, code]
    Point:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required: [lat, lng]
    ChannelStatus:
      type: object
      description: Estado de un canal de notificación; nunca lleva secretos (spec §6.4)
      properties:
        enabled:
          type: boolean
        target:
          type: string
          description: URL de destino sin userinfo, sin query y sin fragmento
        last_ok:
          type: string
          format: date-time
        last_error:
          type: string
        delivered:
          type: integer
        failed:
          type: integer
      required: [enabled, delivered, failed]
    NotifyStatus:
      type: object
      properties:
        webhook:
          $ref: "#/components/schemas/ChannelStatus"
        ntfy:
          $ref: "#/components/schemas/ChannelStatus"
      required: [webhook, ntfy]
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        mode:
          type: string
        enforcement:
          type: string
        web_built:
          type: boolean
        setup_required:
          type: boolean
        engine:
          type: object
          properties:
            running:
              type: boolean
            cycles:
              type: integer
            last_cycle_at:
              type: [string, "null"]
              format: date-time
            interval_seconds:
              type: integer
            last_error:
              type: string
          required: [running, cycles, interval_seconds]
        persistence:
          type: object
          description: Salud del store según el último ciclo del motor (spec §11)
          properties:
            ok:
              type: boolean
            last_error:
              type: string
          required: [ok]
        notify:
          $ref: "#/components/schemas/NotifyStatus"
        map:
          type: object
          properties:
            enabled:
              type: boolean
            tiles_url:
              type: string
          required: [enabled, tiles_url]
      required: [status, version, mode, enforcement, web_built, setup_required, engine, persistence, notify, map]
    SetupRequest:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        mode:
          type: string
          enum: [demo, empty]
      required: [email, name, password, mode]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        org:
          type: string
        role:
          type: string
          enum: [owner, admin, operator, viewer, auditor]
        via:
          type: string
      required: [id, email, name, org, role, via]
    SessionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf:
          type: string
        capabilities:
          type: array
          items:
            type: string
      required: [user, csrf, capabilities]
    Inventory:
      type: object
      properties:
        os_version:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        serial_number:
          type: string
        imei:
          type: string
        battery_level:
          type: integer
        battery_state:
          type: string
        storage_total_gb:
          type: number
        storage_free_gb:
          type: number
        encryption_enabled:
          type: boolean
        carrier:
          type: string
        assigned_user:
          type: string
        department:
          type: string
        device_tag:
          type: string
        enrolled_at:
          type: string
          format: date-time
        last_checkin:
          type: string
          format: date-time
        management_mode:
          type: string
        ownership:
          type: string
        supervised:
          type: boolean
        lockdown_mode:
          type: boolean
        apps:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
            required: [name, version]
    Posture:
      type: object
      description: Observaciones; ausente equivale a desconocido, no a false. País/sitio vacíos y mapa sin métricas se omiten.
      properties:
        rooted:
          type: boolean
        os_outdated:
          type: boolean
        hardware_health:
          type: object
          additionalProperties:
            type: string
        osquery_config_valid:
          type: boolean
        country:
          type: string
        site:
          type: string
    Integrity:
      type: object
      description: Evidencia de ubicación, sin enforcement. Métricas omitidas si faltan datos; checks null significa sin evaluar, [] evaluación sin anomalías.
      properties:
        suspicious:
          type: boolean
        checks:
          type: [array, "null"]
          items:
            type: string
        speed_kmh:
          type: number
        distance_km:
          type: number
      required: [suspicious, checks]
    Verdict:
      type: object
      properties:
        score:
          type: [number, "null"]
        severity:
          type: string
        reasons:
          type: array
          items:
            type: string
        matched_policies:
          type: array
          items:
            type: string
        evaluated_at:
          type: string
          format: date-time
        provenance:
          type: string
        verified:
          type: boolean
      required: [score, severity, reasons, matched_policies, provenance, verified]
    Device:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        status:
          type: string
        compliant:
          type: [boolean, "null"]
        provider:
          type: string
        provider_refs:
          type: object
          additionalProperties:
            type: string
        location:
          type: object
          properties:
            point:
              $ref: "#/components/schemas/Point"
            accuracy_m:
              type: number
            source:
              type: string
            observed_at:
              type: string
              format: date-time
          required: [source, observed_at]
        network:
          type: object
          properties:
            ip:
              type: string
            ssid:
              type: string
            bssid:
              type: string
        inventory:
          $ref: "#/components/schemas/Inventory"
        posture:
          $ref: "#/components/schemas/Posture"
          description: Siempre emitido por D01a (vacío si desconocido); opcional para admitir respuestas M1.
        fence_state:
          type: string
          enum: [inside, outside, unknown]
        inside_fence:
          type: string
        last_inside_fence:
          type: string
        fence_state_since:
          type: string
          format: date-time
          description: Origen del reloj de la clave geocerca/estado; ausente si no evaluado.
        dwell_seconds:
          type: integer
          minimum: 0
          description: Segundos completos en la misma clave, incluido unknown; siempre emitido por D01c, opcional para M1. No acredita permanencia física ni ejecuta acciones.
        route_id:
          type: string
        route_state:
          type: string
          enum: [on_route, off_route, unassigned]
        route_deviation_m:
          type: number
        risk:
          $ref: "#/components/schemas/Verdict"
        location_integrity:
          $ref: "#/components/schemas/Integrity"
          description: Siempre emitido por D01b; opcional para admitir respuestas M1.
        signals:
          type: object
          description: Contenedor pasivo por nombre de señal; ausente si no informado. Sin evaluación de riesgo implícita.
          additionalProperties:
            type: [object, "null"]
            additionalProperties: true
        evaluation_error:
          type: string
        last_report_at:
          type: string
          format: date-time
      required: [id, name, platform, compliant, provider, location, network, inventory, fence_state, inside_fence, last_inside_fence, route_state, risk, last_report_at]
    DeviceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        total:
          type: integer
      required: [items, total]
    TrailPoint:
      type: object
      properties:
        at:
          type: string
          format: date-time
        point:
          $ref: "#/components/schemas/Point"
      required: [at, point]
    FenceAction:
      type: object
      properties:
        action:
          type: string
          enum: [lock, wipe, message, locate, reboot, clear_passcode, set_compliance, custom, notify]
        when:
          type: string
          enum: [on_enter, on_exit, on_violation, on_unknown]
        params:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
      required: [action, when, enabled]
    Fence:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [circle, polygon]
        center:
          $ref: "#/components/schemas/Point"
        radius_m:
          type: number
        polygon:
          type: array
          items:
            $ref: "#/components/schemas/Point"
        rules:
          type: object
          properties:
            violation_interval_cycles:
              type: integer
            dwell_seconds:
              type: integer
        actions:
          type: array
          items:
            $ref: "#/components/schemas/FenceAction"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, kind, rules, actions, created_at, updated_at]
    FenceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Fence"
        total:
          type: integer
      required: [items, total]
    Route:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        corridor_m:
          type: number
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/Point"
        device_ids:
          type: array
          items:
            type: string
        color:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/FenceAction"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, corridor_m, waypoints, device_ids, actions, created_at, updated_at]
    RouteList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        total:
          type: integer
      required: [items, total]
    POI:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        point:
          $ref: "#/components/schemas/Point"
        metadata:
          type: object
          additionalProperties:
            type: string
      required: [id, name, category, point]
    POIList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/POI"
        total:
          type: integer
      required: [items, total]
    ProviderHealth:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
        devices:
          type: integer
        latency_ms:
          type: integer
        last_ok:
          type: string
          format: date-time
      required: [ok, devices, latency_ms]
    EnforcementSettings:
      type: object
      description: >-
        Guardarraíles vigentes del motor (spec §5.4). live_actions es una
        allowlist cerrada: solo lo listado sale en vivo, y una lista nula
        equivale a la lista vacía —ninguna acción sale en vivo, todo queda en
        dry-run—, porque 2.0 falla cerrado (spec §3 principio 3).
      properties:
        mode:
          type: string
          enum: [observe, enforce]
        live_actions:
          type: [array, "null"]
          items:
            type: string
        allow_wipe:
          type: boolean
        wipe_allowlist:
          type: [array, "null"]
          items:
            type: string
        action_cooldown_seconds:
          type: integer
      required: [mode, live_actions, allow_wipe, wipe_allowlist, action_cooldown_seconds]
    CycleStats:
      type: object
      properties:
        at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        mode:
          type: string
        devices_total:
          type: integer
        inside:
          type: integer
        outside:
          type: integer
        unknown:
          type: integer
        risk_evaluated:
          type: integer
        risk_failed:
          type: integer
        by_severity:
          type: object
          additionalProperties:
            type: integer
        transitions:
          type: integer
        actions_planned:
          type: integer
        actions_executed:
          type: integer
        actions_suppressed:
          type: integer
        actions_blocked:
          type: integer
        incidents_opened:
          type: integer
        incidents_closed:
          type: integer
        alerts_fired:
          type: integer
        handoffs_pending:
          type: integer
        deliveries:
          type: integer
        deliveries_failed:
          type: integer
        evaluation_errors:
          type: integer
        persistence_errors:
          type: integer
        providers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProviderHealth"
      required: [at, duration_ms, mode, devices_total, inside, outside, unknown, transitions, actions_planned, actions_executed, actions_suppressed, actions_blocked, incidents_opened, incidents_closed, alerts_fired, handoffs_pending, deliveries, deliveries_failed, evaluation_errors, persistence_errors, providers, risk_evaluated, risk_failed, by_severity]
    EngineStatus:
      type: object
      properties:
        mode:
          type: string
        enforcement:
          $ref: "#/components/schemas/EnforcementSettings"
        interval_seconds:
          type: integer
        running:
          type: boolean
        cycles:
          type: integer
        last_cycle:
          $ref: "#/components/schemas/CycleStats"
        last_error:
          type: string
        next_cycle_at:
          type: string
          format: date-time
        providers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ProviderHealth"
        incidents_open:
          type: integer
        notify:
          $ref: "#/components/schemas/NotifyStatus"
      required: [mode, enforcement, interval_seconds, running, cycles, providers, incidents_open, notify]
    Playbook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        when:
          type: array
          items:
            $ref: "#/components/schemas/PolicyCondition"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyAction"
        enabled:
          type: boolean
        severity:
          type: string
          enum: [low, medium, high, critical]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, description, when, actions, enabled, severity, created_at, updated_at]
    PlaybookList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Playbook"
        total:
          type: integer
      required: [items, total]
    Handoff:
      type: object
      properties:
        id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        playbook_id:
          type: string
        playbook_name:
          type: string
        action:
          type: string
          enum: [lock, wipe, message, locate, reboot, clear_passcode, set_compliance, custom, notify]
        params:
          type: object
          additionalProperties: true
        reason:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [pending, approved, rejected, executed]
        requested_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
        decided_by:
          type: string
        note:
          type: string
        result:
          $ref: "#/components/schemas/ActionResult"
      required: [id, device_id, device_name, playbook_id, playbook_name, action, reason, severity, status, requested_at]
    HandoffList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Handoff"
        total:
          type: integer
      required: [items, total]
    HandoffDecision:
      type: object
      properties:
        note:
          type: string
    DeviceActionRequest:
      type: object
      properties:
        action:
          type: string
          enum: [lock, wipe, message, locate, reboot, clear_passcode, set_compliance, custom, notify]
        params:
          type: object
          additionalProperties: true
      required: [action]
    Transition:
      type: object
      properties:
        at:
          type: string
          format: date-time
        device_id:
          type: string
        device_name:
          type: string
        from:
          type: string
        to:
          type: string
      required: [at, device_id, device_name, from, to]
    ActionResult:
      type: object
      properties:
        adapter:
          type: string
        ok:
          type: boolean
        device_id:
          type: string
        device_name:
          type: string
        action:
          type: string
        params:
          type: object
          additionalProperties: true
        dry_run:
          type: boolean
        simulated:
          type: boolean
        error:
          type: string
        command_id:
          type: string
        note:
          type: string
        at:
          type: string
          format: date-time
        fence_id:
          type: string
        trigger:
          type: string
        route_id:
          type: string
        policy_id:
          type: string
        playbook_id:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        blocked:
          type: boolean
          description: Solo se emite si true; su ausencia no acredita autorización ni ejecución.
        error_type:
          type: string
      required: [adapter, ok, device_id, device_name, action, dry_run, simulated, at]
    PolicyCondition:
      type: object
      properties:
        field:
          type: string
          description: Uno de los de /api/v1/policies/fields, o "signal:<nombre>.<clave>" para una señal de riesgo
        op:
          type: string
          enum: [eq, ne, gt, gte, lt, lte, in, contains]
        value: {}
      required: [field, op, value]
    PolicyAction:
      type: object
      properties:
        action:
          type: string
          enum: [lock, wipe, message, locate, reboot, clear_passcode, set_compliance, custom, notify]
        params:
          type: object
          additionalProperties: true
      required: [action]
    Policy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        when:
          type: array
          description: Condiciones unidas por AND; una lista vacía nunca dispara y no se puede guardar
          items:
            $ref: "#/components/schemas/PolicyCondition"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyAction"
        enabled:
          type: boolean
        severity:
          type: string
          enum: [low, medium, high, critical]
          description: Severidad que la política estampa en las acciones que dispara; obligatoria, el servidor rechaza cualquier otro valor con 400
        source:
          type: string
        template_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, when, actions, enabled, severity, created_at, updated_at]
    PolicyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
        total:
          type: integer
      required: [items, total]
    PolicyTemplateList:
      type: object
      properties:
        items:
          type: array
          description: Plantillas sin fechar; las sella quien las guarda
          items:
            $ref: "#/components/schemas/Policy"
        total:
          type: integer
      required: [items, total]
    PolicyFieldCatalog:
      type: object
      properties:
        fields:
          type: array
          items:
            type: string
        ops:
          type: array
          items:
            type: string
            enum: [eq, ne, gt, gte, lt, lte, in, contains]
      required: [fields, ops]
    ReplayRequest:
      type: object
      properties:
        policy:
          $ref: "#/components/schemas/Policy"
        limit:
          type: integer
          description: Puntos del histórico a simular. Ausente o menor que 1 usa 5000; por encima de 20000 se acota a 20000, nunca es un error
        use_current_fences:
          type: boolean
          description: Recalcula el estado de geocerca con las geocercas de hoy en vez de leerlo del histórico de eventos
      required: [policy]
    ReplaySample:
      type: object
      properties:
        at:
          type: string
          format: date-time
        device_id:
          type: string
        device_name:
          type: string
        fence_state:
          type: string
        score:
          type: [number, "null"]
        severity:
          type: string
        reasons:
          type: array
          items:
            type: string
      required: [at, device_id, device_name, fence_state, score, severity, reasons]
    ReplayResult:
      type: object
      properties:
        policy_id:
          type: string
        points_evaluated:
          type: integer
        devices_evaluated:
          type: integer
        firings:
          type: integer
        by_device:
          type: object
          additionalProperties:
            type: integer
        by_action:
          type: object
          additionalProperties:
            type: integer
        approximation:
          type: boolean
          description: True cuando el resultado no es exacto, porque hay campos que se leen del dispositivo de hoy o porque la permanencia se midió desde la ventana simulada; el motivo concreto va en notes
        notes:
          type: array
          description: Qué se pudo reconstruir y qué no, en español; un cero sin notas sería un falso verde
          items:
            type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        samples:
          type: array
          items:
            $ref: "#/components/schemas/ReplaySample"
      required: [policy_id, points_evaluated, devices_evaluated, firings, by_device, by_action, approximation, notes, samples]
