        off_hours_end:
          type: integer
      required: [shift_zones, zone_risk, off_hours_start, off_hours_end]
    Settings:
      type: object
      properties:
        schema_version:
          type: integer
        enforcement:
          $ref: "#/components/schemas/EnforcementSettings"
        webhook:
          $ref: "#/components/schemas/WebhookSettings"
        ntfy:
          $ref: "#/components/schemas/NtfySettings"
        egress:
          $ref: "#/components/schemas/EgressSettings"
        risk:
