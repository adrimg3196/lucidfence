    WebhookSettings:
      type: object
      description: >-
        Canal de webhook firmado. secret_set dice si hay credencial guardada;
        el valor no sale nunca por la API.
      properties:
        url:
          type: string
        format:
          type: string
          enum: [native, ocsf]
        events:
          type: array
          items:
            type: string
            enum: [incident.opened, incident.closed, handoff.pending, action.executed, alert.fired]
        enabled:
          type: boolean
        secret_set:
          type: boolean
      required: [url, format, events, enabled, secret_set]
    WebhookSettingsUpdate:
      type: object
      description: >-
        Cuerpo de PUT /settings/webhooks. secret es de solo escritura: si
        falta no se toca el secreto guardado, la cadena vacía lo borra y
        cualquier otro valor lo sustituye. secret_set no se acepta.
      properties:
        url:
          type: string
        format:
          type: string
          enum: [native, ocsf]
        events:
          type: array
          items:
            type: string
            enum: [incident.opened, incident.closed, handoff.pending, action.executed, alert.fired]
        enabled:
          type: boolean
        secret:
          type: string
          writeOnly: true
      required: [url, format, events, enabled]
    NtfySettings:
      type: object
      properties:
        url:
          type: string
        enabled:
          type: boolean
        token_set:
          type: boolean
      required: [url, enabled, token_set]
    NtfySettingsUpdate:
      type: object
      description: >-
        Cuerpo de PUT /settings/ntfy. token es de solo escritura: si falta no
        se toca el token guardado, la cadena vacía lo borra y cualquier otro
        valor lo sustituye. token_set no se acepta.
      properties:
        url:
          type: string
        enabled:
          type: boolean
        token:
          type: string
          writeOnly: true
      required: [url, enabled]
    EgressSettings:
      type: object
      description: Allowlist de salida. Vacía deniega todo; allow_private abre RFC1918 y loopback, nunca link-local.
      properties:
        hosts:
          type: array
          items:
            type: string
        allow_private:
          type: boolean
      required: [hosts, allow_private]
    RiskSettings:
      type: object
      properties:
