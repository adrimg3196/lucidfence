{
  "//": "Pack osquery de LucidFence. Instalar como pack ('packs': {'lucidfence': '/ruta/lucidfence.conf'}) o fusionar 'schedule' en osquery.conf. LucidFence parsea el results log del filesystem logger (osqueryd.results.log) — ver docs/operations/OSQUERY.md.",
  "schedule": {
    "lf_os_version": {
      "query": "SELECT name, version, platform FROM os_version;",
      "interval": 300,
      "snapshot": true
    },
    "lf_disk_encryption": {
      "query": "SELECT name, encrypted, type FROM disk_encryption;",
      "interval": 300,
      "snapshot": true
    },
    "lf_storage": {
      "query": "SELECT path, blocks, blocks_available, blocks_size FROM mounts WHERE path = '/';",
      "interval": 300,
      "snapshot": true
    },
    "lf_battery": {
      "query": "SELECT percent_remaining FROM battery;",
      "interval": 300,
      "snapshot": true
    },
    "lf_agent_health": {
      "query": "SELECT version, uuid FROM osquery_info;",
      "interval": 300,
      "snapshot": true
    }
  }
}
